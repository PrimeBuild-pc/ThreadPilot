version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
  # Keeps the SHA-pinned workflow actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # CodeQL init/analyze must always run the same action version.
      codeql:
        patterns:
          - "github/codeql-action*"
    labels:
      - dependencies
      - security
