version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # 11.x runtime packages drop net8.0 (and System.Drawing.Common 11 breaks the build);
    # remove this once the TargetFramework moves to net10.0.
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - security
  # Keeps the SHA-pinned workflow actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # CodeQL init/analyze must always run the same action version.
      codeql:
        patterns:
          - "github/codeql-action*"
    labels:
      - dependencies
      - security
