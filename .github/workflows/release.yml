name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run_publish:
        description: "Sign with the test certificate without publishing to GitHub, WinGet, or Chocolatey"
        required: false
        default: "true"
        type: choice
        options:
          - "false"
          - "true"

# Read-only by default: only the job that publishes the GitHub release gets write access.
permissions:
  contents: read

concurrency:
  group: threadpilot-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Match the Windows 11-era APIs exercised by the native integration tests.
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $refName = $env:REF_NAME
          if ($refName -match '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            $version = $refName.TrimStart('v')
            $tag = $refName
          }
          else {
            [xml]$project = Get-Content "ThreadPilot.csproj"
            $version = $project.Project.PropertyGroup.Version
            if ([string]::IsNullOrWhiteSpace($version)) {
              throw "Unable to resolve version from tag or ThreadPilot.csproj"
            }

            $tag = "v$version"
          }

          $prerelease = $version.Contains('-').ToString().ToLowerInvariant()
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Resolve SignPath policy
        id: signing
        shell: pwsh
        env:
          TEST_SIGNING: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run_publish == 'true' }}
          RELEASE_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) {
            throw "The SIGNPATH_API_TOKEN repository secret is required."
          }

          $policy = $env:RELEASE_POLICY
          if ($env:TEST_SIGNING -eq 'true') {
            $policy = 'test-signing'
          } elseif ([string]::IsNullOrWhiteSpace($policy) -or $policy -eq 'test-signing') {
            throw "Set SIGNPATH_SIGNING_POLICY_SLUG to the approved production policy before publishing."
          }

          "policy=$policy" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore "ThreadPilot_1.sln"

      - name: Build
        run: dotnet build "ThreadPilot_1.sln" --configuration Release --no-restore

      - name: Test
        run: dotnet test "Tests/ThreadPilot.Core.Tests/ThreadPilot.Core.Tests.csproj" --configuration Release --no-restore --verbosity normal --collect:"XPlat Code Coverage" --settings "Tests/ThreadPilot.Core.Tests/coverlet.runsettings" --results-directory TestResults

      - name: Publish self-contained single-file
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet publish "ThreadPilot.csproj" --configuration Release -p:PublishProfile=WinX64-SingleFile "-p:InformationalVersion=$env:VERSION" -p:IncludeSourceRevisionInInformationalVersion=false

      - name: Publish ReadyToRun
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet publish "ThreadPilot.csproj" --configuration Release -p:PublishProfile=WinX64-ReadyToRun "-p:InformationalVersion=$env:VERSION" -p:IncludeSourceRevisionInInformationalVersion=false

      - name: Package application binaries for signing
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'signpath'
          New-Item -ItemType Directory -Force -Path "$staging/unsigned" | Out-Null
          foreach ($profile in 'singlefile', 'readytorun') {
            New-Item -ItemType Directory -Path "$staging/apps/$profile" -Force | Out-Null
            Copy-Item -LiteralPath "artifacts/release/$profile/ThreadPilot.exe" -Destination "$staging/apps/$profile/"
          }
          Compress-Archive -Path "$staging/apps/*" -DestinationPath "$staging/unsigned/threadpilot-apps.zip"

      - name: Upload unsigned application binaries ZIP
        id: unsigned-apps
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/signpath/unsigned/threadpilot-apps.zip
          archive: false
          if-no-files-found: error

      - name: Sign application binaries with SignPath
        id: signed-apps
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 5481e6eb-6003-4432-8c51-98f28c9d5c20
          project-slug: ThreadPilot
          signing-policy-slug: ${{ steps.signing.outputs.policy }}
          artifact-configuration-slug: windows-apps
          github-artifact-id: ${{ steps.unsigned-apps.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: ${{ runner.temp }}/signpath/downloads/apps
          skip-decompress: true
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}

      - name: Use signed application binaries
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'signpath'
          New-Item -ItemType Directory -Force -Path "$staging/signed" | Out-Null
          $archive = @(Get-ChildItem -LiteralPath "$staging/downloads/apps" -File -Filter '*.zip')
          if ($archive.Count -ne 1) {
            throw "Expected one signed apps ZIP, got $($archive.Count)."
          }
          $signedZip = "$staging/signed/threadpilot-apps.zip"
          Copy-Item -LiteralPath $archive[0].FullName -Destination $signedZip
          Expand-Archive -LiteralPath $signedZip -DestinationPath "$staging/signed-apps"
          foreach ($profile in 'singlefile', 'readytorun') {
            Copy-Item -LiteralPath "$staging/signed-apps/$profile/ThreadPilot.exe" -Destination "artifacts/release/$profile/" -Force
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $sourceDir = (Resolve-Path "artifacts/release/singlefile").Path

          & iscc.exe "/DMyAppVersion=$version" "/DMyAppSourceDir=$sourceDir" "Installer/setup.iss"

      - name: Package the installer for signing
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'signpath'
          Compress-Archive -LiteralPath "artifacts/release/installer/ThreadPilot_${env:TAG}_Setup.exe" -DestinationPath "$staging/unsigned/threadpilot-installer.zip"

      - name: Upload unsigned installer ZIP
        id: unsigned-installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/signpath/unsigned/threadpilot-installer.zip
          archive: false
          if-no-files-found: error

      - name: Sign installer with SignPath
        id: signed-installer
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 5481e6eb-6003-4432-8c51-98f28c9d5c20
          project-slug: ThreadPilot
          signing-policy-slug: ${{ steps.signing.outputs.policy }}
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: ${{ runner.temp }}/signpath/downloads/installer
          skip-decompress: true
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}

      - name: Use the signed installer and verify Authenticode
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
          POLICY: ${{ steps.signing.outputs.policy }}
          APPS_REQUEST: ${{ steps.signed-apps.outputs.signing-request-web-url }}
          INSTALLER_REQUEST: ${{ steps.signed-installer.outputs.signing-request-web-url }}
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'signpath'
          $archive = @(Get-ChildItem -LiteralPath "$staging/downloads/installer" -File -Filter '*.zip')
          if ($archive.Count -ne 1) {
            throw "Expected one signed installer ZIP, got $($archive.Count)."
          }
          $signedZip = "$staging/signed/threadpilot-installer.zip"
          Copy-Item -LiteralPath $archive[0].FullName -Destination $signedZip
          Expand-Archive -LiteralPath $signedZip -DestinationPath "$staging/signed-installer"
          $installer = "ThreadPilot_${env:TAG}_Setup.exe"
          Copy-Item -LiteralPath "$staging/signed-installer/$installer" -Destination "artifacts/release/installer/" -Force

          $files = @(
            'artifacts/release/singlefile/ThreadPilot.exe'
            'artifacts/release/readytorun/ThreadPilot.exe'
            "artifacts/release/installer/$installer"
          )

          # Trust only the pinned self-signed certificate for this verification step.
          $store = $null
          $addedCertificate = $null
          try {
            if ($env:POLICY -eq 'test-signing') {
              $testThumbprint = '78B778434A5DAE1F58BE91AE237444AC55EF26BC'
              $testCertificate = (Get-AuthenticodeSignature -LiteralPath $files[0]).SignerCertificate
              if ($testCertificate.Thumbprint -ne $testThumbprint) {
                throw "The application was not signed by the expected SignPath test certificate."
              }
              $store = [System.Security.Cryptography.X509Certificates.X509Store]::new('Root', 'CurrentUser')
              $store.Open('ReadWrite')
              if (-not ($store.Certificates | Where-Object Thumbprint -eq $testThumbprint)) {
                $store.Add($testCertificate)
                $addedCertificate = $testCertificate
              }
            }

            foreach ($file in $files) {
              $signature = Get-AuthenticodeSignature -LiteralPath $file
              if ($signature.Status -ne 'Valid') {
                throw "Invalid Authenticode signature on ${file}: $($signature.StatusMessage)"
              }
              if ($env:POLICY -eq 'test-signing' -and $signature.SignerCertificate.Thumbprint -ne $testThumbprint) {
                throw "Unexpected test certificate on $file."
              }
              if ($env:POLICY -ne 'test-signing' -and $signature.SignerCertificate.Subject -eq $signature.SignerCertificate.Issuer) {
                throw "A self-signed certificate cannot be used for the public release: $file."
              }
              "- Verified $file ($($signature.SignerCertificate.Subject))" >> $env:GITHUB_STEP_SUMMARY
            }
          } finally {
            if ($null -ne $addedCertificate) {
              $store.Remove($addedCertificate)
            }
            if ($null -ne $store) {
              $store.Dispose()
            }
          }

          "- [Application signing request]($env:APPS_REQUEST)" >> $env:GITHUB_STEP_SUMMARY
          "- [Installer signing request]($env:INSTALLER_REQUEST)" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload signed ZIPs for test review
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run_publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signpath-signed-zips
          path: ${{ runner.temp }}/signpath/signed/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Create release packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.tag }}"
          New-Item -ItemType Directory -Force -Path "artifacts/release/packages" | Out-Null
          New-Item -ItemType Directory -Force -Path "artifacts/release/package-staging" | Out-Null

          $sharedUninstall = "artifacts/release/package-staging/uninstall.bat"
          $sharedLicense = "artifacts/release/package-staging/LICENSE.md"

          $uninstallContent = @'
          @echo off
          setlocal EnableExtensions
          title ThreadPilot Uninstaller

          set "APP_DIR=%~dp0"
          if "%APP_DIR:~-1%"=="\" set "APP_DIR=%APP_DIR:~0,-1%"

          echo ======================================================
          echo ThreadPilot Uninstaller
          echo ======================================================
          echo.

          echo [1/4] Closing running ThreadPilot processes...
          taskkill /IM "ThreadPilot.exe" /F >nul 2>&1

          echo [2/4] Removing startup task and startup registry entry...
          schtasks /Delete /TN "ThreadPilot_Launch" /F >nul 2>&1
          schtasks /Delete /TN "ThreadPilot_Startup" /F >nul 2>&1
          reg delete "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v "ThreadPilot" /f >nul 2>&1

          echo [3/4] Removing ThreadPilot user data for this Windows account...
          rem Full uninstall removes only ThreadPilot-owned per-user AppData. Normal install/update paths never run this script.
          if exist "%APPDATA%\ThreadPilot" (
            rd /s /q "%APPDATA%\ThreadPilot"
            echo ThreadPilot user data removed.
          ) else (
            echo No ThreadPilot user data folder found.
          )

          echo [4/4] Scheduling app folder removal...
          start "" /min cmd /c "timeout /t 5 /nobreak >nul & rd /s /q \"%APP_DIR%\""

          echo.
          echo Uninstall completed. Remaining files will be removed in a few seconds.
          endlocal
          exit /b 0
          '@

          Set-Content -LiteralPath $sharedUninstall -Value $uninstallContent -Encoding Ascii
          Copy-Item "LICENSE" -Destination $sharedLicense -Force

          $portableStage = "artifacts/release/package-staging/portable"
          New-Item -ItemType Directory -Force -Path $portableStage | Out-Null

          Copy-Item "artifacts/release/singlefile/*" -Destination $portableStage -Recurse -Force

          Copy-Item $sharedUninstall -Destination (Join-Path $portableStage "uninstall.bat") -Force
          Copy-Item $sharedLicense -Destination (Join-Path $portableStage "LICENSE.md") -Force

          $portableZip = "artifacts/release/packages/ThreadPilot_$version`_Portable.zip"

          Compress-Archive -Path "$portableStage/*" -DestinationPath $portableZip -Force

      - name: Generate checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hashFile = "artifacts/release/SHA256SUMS.txt"

          $releaseFiles = @()
          $releaseFiles += Get-ChildItem "artifacts/release/packages" -File -ErrorAction SilentlyContinue
          $releaseFiles += Get-ChildItem "artifacts/release/installer/*.exe" -File -ErrorAction SilentlyContinue

          $releaseFiles | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)" | Out-File -FilePath $hashFile -Append -Encoding utf8
          }

      - name: Generate winget manifests
        if: steps.version.outputs.prerelease != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $installer = Get-ChildItem "artifacts/release/installer/*.exe" -File | Select-Object -First 1
          if (-not $installer)
          {
            throw "Installer executable not found."
          }

          $sha = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToUpperInvariant()
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$($installer.Name)"

          ./build/generate-winget-manifests.ps1 `
            -Version $version `
            -Tag $tag `
            -InstallerUrl $url `
            -InstallerSha256 $sha `
            -OutputRoot "winget-manifests"

      - name: Generate SBOM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet tool install --global Microsoft.Sbom.DotNetTool --version 4.1.13
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          sbom-tool generate -b ./artifacts -bc . -pn ThreadPilot -pv "${{ steps.version.outputs.version }}" -ps PrimeBuild -nsb https://github.com/PrimeBuild-pc/ThreadPilot

          $sbomReleaseDir = "artifacts/release/sbom"
          New-Item -ItemType Directory -Force -Path $sbomReleaseDir | Out-Null

          $sbomManifest = Get-ChildItem "artifacts" -Recurse -File -Filter "manifest.spdx.json" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if (-not $sbomManifest)
          {
            throw "SBOM manifest not found under artifacts after generation."
          }

          Copy-Item -LiteralPath $sbomManifest.FullName -Destination (Join-Path $sbomReleaseDir "manifest.spdx.json") -Force

      - name: Upload portable artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-portable
          path: artifacts/release/singlefile

      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-installer
          path: artifacts/release/installer

      - name: Upload packages artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: artifacts/release/packages

      - name: Upload checksums artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-checksums
          path: artifacts/release/SHA256SUMS.txt

      - name: Upload winget manifests
        if: steps.version.outputs.prerelease != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-manifests
          path: winget-manifests

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: artifacts/release/sbom/manifest.spdx.json
          if-no-files-found: error

  smoke-test:
    runs-on: windows-2025
    needs: build

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-portable
          path: smoke

      - name: Smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem "smoke" -Recurse -Filter "ThreadPilot.exe" -File | Select-Object -First 1
          if (-not $exe)
          {
            throw "ThreadPilot.exe not found in smoke-test artifact."
          }

          $process = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0)
          {
            throw "Smoke test failed with exit code $($process.ExitCode)."
          }

  release:
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run_publish == 'false'
    runs-on: ubuntu-latest
    # Protected environment: waits for the maintainer's approval before it can write the release.
    environment: release
    permissions:
      contents: write
    needs:
      - build
      - smoke-test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download installer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-installer
          path: release-assets/installer

      - name: Download packages artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: release-assets/packages

      - name: Download checksums artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-checksums
          path: release-assets

      - name: Download winget manifests
        if: needs.build.outputs.prerelease != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: winget-manifests
          path: winget-manifests

      - name: Download SBOM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail

          compgen -G "release-assets/installer/*.exe" > /dev/null || { echo "Missing installer executable in release-assets/installer"; exit 1; }
          compgen -G "release-assets/packages/*.zip" > /dev/null || { echo "Missing release package zip in release-assets/packages"; exit 1; }
          test -f "release-assets/SHA256SUMS.txt" || { echo "Missing release checksums file"; exit 1; }
          if [ "${{ needs.build.outputs.prerelease }}" != "true" ]; then
            find "winget-manifests" -type f -name "*.yaml" | grep -q . || { echo "Missing winget manifest yaml files"; exit 1; }
          fi
          test -f "sbom/manifest.spdx.json" || { echo "Missing SBOM manifest"; exit 1; }

      - name: Stage public GitHub release assets
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ needs.build.outputs.tag }}"
          mkdir -p public-release-assets

          cp "release-assets/installer/ThreadPilot_${tag}_Setup.exe" "public-release-assets/ThreadPilot_${tag}_Setup.exe"
          cp "release-assets/packages/ThreadPilot_${tag}_Portable.zip" "public-release-assets/ThreadPilot_${tag}_Portable.zip"
          cp "release-assets/SHA256SUMS.txt" "public-release-assets/SHA256SUMS.txt"

          expected_count=3
          actual_count="$(find public-release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "$actual_count" != "$expected_count" ]; then
            echo "Expected $expected_count public release asset files, found $actual_count."
            find public-release-assets -maxdepth 1 -type f -print
            exit 1
          fi

      - name: Install git-cliff
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: git-cliff@2.10.0

      - name: Generate changelog
        id: git-cliff
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "docs/releases/${{ needs.build.outputs.tag }}.md" ]; then
            cp "docs/releases/${{ needs.build.outputs.tag }}.md" release-notes.md
          else
            git-cliff --config cliff.toml --latest > release-notes.md
          fi

          {
            echo "content<<EOF"
            cat release-notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Contributors file check (manual maintenance mode)
        shell: pwsh
        run: |
          if (-not (Test-Path "CONTRIBUTORS.md")) {
            throw "CONTRIBUTORS.md not found."
          }

          Write-Host "CONTRIBUTORS.md is maintained manually in this workflow."

      - name: Verify tag provenance and public checksums
        shell: bash
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          refs="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          test -n "$refs"
          tagged_commit="$(tail -n1 <<< "$refs" | cut -f1)"
          test "$tagged_commit" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$tagged_commit" origin/main
          cd public-release-assets
          sha256sum --strict --check SHA256SUMS.txt

      - name: Stage GitHub release as draft
        id: draft-release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ThreadPilot ${{ needs.build.outputs.tag }}
          body: ${{ steps.git-cliff.outputs.content }}
          files: |
            public-release-assets/ThreadPilot_${{ needs.build.outputs.tag }}_Setup.exe
            public-release-assets/ThreadPilot_${{ needs.build.outputs.tag }}_Portable.zip
            public-release-assets/SHA256SUMS.txt
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.build.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true
          draft: true
          overwrite_files: false
          fail_on_unmatched_files: true

      - name: Verify uploaded assets and publish the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          RELEASE_ID: ${{ steps.draft-release.outputs.id }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          jq -e --arg tag "$TAG" --argjson prerelease "$PRERELEASE"             '.draft and .tag_name == $tag and .prerelease == $prerelease and (.assets|length == 3)' <<< "$release" >/dev/null
          for path in public-release-assets/*; do
            file="${path##*/}"
            digest="sha256:$(sha256sum "$path" | cut -d' ' -f1)"
            jq -e --arg name "$file" --arg digest "$digest" 'any(.assets[]; .name == $name and .digest == $digest)' <<< "$release" >/dev/null
          done
          refs="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          test "$(tail -n1 <<< "$refs" | cut -f1)" = "$GITHUB_SHA"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  publish-winget:
    runs-on: windows-2022
    environment: release
    needs:
      - build
      - release
    if: needs.release.result == 'success' && needs.build.outputs.prerelease != 'true'

    steps:
      - name: Resolve winget publish policy
        id: policy
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run_publish }}
        run: |
          $ErrorActionPreference = "Stop"
          $dryRun = $env:EVENT_NAME -eq "workflow_dispatch" -and $env:DRY_RUN_INPUT -eq "true"
          "dry_run=$($dryRun.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check winget publish policy
        id: gate
        shell: pwsh
        env:
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          WINGET_FORK_OWNER: ${{ secrets.WINGET_FORK_OWNER }}
        run: |
          $ErrorActionPreference = "Stop"
          $logsDir = "release-channel-logs"
          New-Item -ItemType Directory -Force -Path $logsDir | Out-Null
          $logPath = Join-Path $logsDir "winget-submit-log.txt"
          $dryRun = "${{ steps.policy.outputs.dry_run }}" -eq "true"

          if ($dryRun)
          {
            $summary = @(
              "## winget publish",
              "- attempted: false",
              "- version: ${{ needs.build.outputs.version }}",
              "- result: dry-run",
              "- reason: workflow_dispatch requested dry_run_publish=true"
            )

            $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            "Dry run requested. Winget submission intentionally skipped." | Set-Content -Path $logPath -Encoding utf8
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          if ([string]::IsNullOrWhiteSpace($env:WINGET_GITHUB_TOKEN) -or [string]::IsNullOrWhiteSpace($env:WINGET_FORK_OWNER))
          {
            $message = "Winget publish secrets are missing. Refusing to report a green public release without a submission attempt."
            $summary = @(
              "## winget publish",
              "- attempted: false",
              "- version: ${{ needs.build.outputs.version }}",
              "- result: failed-policy",
              "- reason: missing WINGET_GITHUB_TOKEN and/or WINGET_FORK_OWNER"
            )

            $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            $message | Set-Content -Path $logPath -Encoding utf8
            throw $message
          }

          "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download winget manifests
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: winget-manifests
          path: winget-manifests

      - name: Submit winget PR
        if: steps.gate.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          WINGET_FORK_OWNER: ${{ secrets.WINGET_FORK_OWNER }}
        run: |
          $ErrorActionPreference = "Stop"
          $logsDir = "release-channel-logs"
          New-Item -ItemType Directory -Force -Path $logsDir | Out-Null
          $logPath = Join-Path $logsDir "winget-submit-log.txt"

          try
          {
            & ./build/submit-winget-pr.ps1 `
              -Version "${{ needs.build.outputs.version }}" `
              -ManifestSourcePath "winget-manifests" `
              -ForkOwner "$env:WINGET_FORK_OWNER" `
              -RepositoryOwner "PrimeBuild" `
              -PackageIdentifier "PrimeBuild.ThreadPilot" `
              -GithubToken "$env:WINGET_GITHUB_TOKEN" *>&1 | Tee-Object -FilePath $logPath

            if ($LASTEXITCODE -ne 0)
            {
              throw "submit-winget-pr.ps1 exited with code $LASTEXITCODE"
            }

            @(
              "## winget publish",
              "- attempted: true",
              "- version: ${{ needs.build.outputs.version }}",
              "- result: submitted"
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
          catch
          {
            @(
              "## winget publish",
              "- attempted: true",
              "- version: ${{ needs.build.outputs.version }}",
              "- result: failed"
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            throw
          }

      - name: Upload winget publish logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-publish-logs
          path: release-channel-logs/winget-submit-log.txt
          if-no-files-found: error
